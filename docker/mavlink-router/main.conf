# Corvus onboard computer.
#
# Now:   PX4 flight controller over USB  ->  UDP 14550 (QGroundControl) + TCP 5760
# Later: add the 900 MHz backhaul and 433 MHz rover-link endpoints below and
#        mavlink-router routes between all of them by system ID.

[General]
TcpServerPort=5760
ReportStats=false
MavlinkDialect=auto

[UartEndpoint fc]
Device=/dev/autopilot
Baud=115200

# Ground station over WiFi. Server mode = order-independent at boot
# QGroundControl's default UDP link finds it automatically
[UdpEndpoint qgc]
Mode=Server
Address=0.0.0.0
Port=14550
